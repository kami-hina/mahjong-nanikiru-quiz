<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Mortal一括解析</title>
<style>
  body{font:13px sans-serif;width:420px;margin:0;padding:12px;color:#222}
  h1{font-size:15px;margin:0 0 8px}
  textarea{width:100%;height:90px;box-sizing:border-box;font:12px monospace}
  button{margin:4px 4px 4px 0;padding:5px 10px}
  .primary{background:#2a7;color:#fff;border:0;border-radius:4px}
  #st{margin:8px 0;padding:6px 8px;background:#f3f3f3;border-radius:4px}
  #list{max-height:220px;overflow:auto;font-size:11px;border-top:1px solid #ddd;margin-top:6px}
  #list div{padding:3px 0;border-bottom:1px solid #eee;word-break:break-all}
  .ok{color:#2a7}.ng{color:#c33}.now{color:#06c}
  .muted{color:#777}
</style></head>
<body>
<h1>Mortal一括解析</h1>
<p class="muted" style="margin:0 0 6px">牌譜URL（天鳳・雀魂）を1行1つ貼って「開始」。人間確認のチェックだけ押せば、あとは自動で送信→結果URLを控えて次へ進みます。</p>
<textarea id="urls" placeholder="https://game.mahjongsoul.com/?paipu=…_a…&#10;https://tenhou.net/0/?log=…&amp;tw=0"></textarea>
<div>
  <button class="primary" id="start">開始</button>
  <button id="stop">停止</button>
  <button id="retry">失敗分をやり直す</button>
  <button id="reset">全部消す</button>
</div>
<div id="st"></div>
<div>
  <button class="primary" id="copy">結果をコピー（牌譜URL ⇥ MortalURL）</button>
  <button id="copy2">MortalURLだけコピー</button>
</div>
<p class="muted" style="margin:6px 0 0">コピーしたものをクイズアプリの「取り込み」欄に貼ると、牌譜URLを紐づけたまま取り込めます。</p>
<div id="list"></div>
<script src="popup.js"></script>
</body></html>
