<style>

  --bg:#0b2f33; --panel:#12474d; --line:#1e6a72; --fg:#eaf6f5; --muted:#9dc4c4;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);

body{padding-bottom:calc(66px + var(--safe-b))}
h1,h2{margin:0 0 8px;font-weight:700}h2{font-size:17px}
a{color:var(--accent)}
.wrap{padding:12px 12px 24px;max-width:760px;margin:0 auto}

<body>
<div id="view" class="wrap"></div>
<nav>
  <button data-tab="quiz" class="on"><span class="ico">🀄️</span>クイズ</button>
  <button data-tab="add"><span class="ico">＋</span>取り込み</button>

  <button data-tab="settings"><span class="ico">⚙️</span>設定</button>

<script>
"use strict";
/* ========================= 小物 ========================= */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let toastT=null;
function toast(m,ms){const o=$('.toast');if(o)o.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),ms||2800);}

/* ========================= 牌 ========================= */
// 内部表記: 1m..9m / 1p..9p / 1s..9s / 1z..7z(東南西北白發中) / 0m,0p,0s=赤5
const HONOR=['','東','南','西','北','白','發','中'], KANJI=['','一','二','三','四','五','六','七','八','九'];
const MJ2={E:'1z',S:'2z',W:'3z',N:'4z',P:'5z',F:'6z',C:'7z'};
const CH2Z={'東':'1z','南':'2z','西':'3z','北':'4z','白':'5z','發':'6z','発':'6z','中':'7z'};
function cvMjai(p){ if(!p) return null; if(MJ2[p]) return MJ2[p];
  if(/^5[mps]r$/.test(p)) return '0'+p[1]; if(/^[0-9][mps]$/.test(p)) return p; return null; }
function normTile(t){ if(t==null) return null; let s=String(t).trim(); if(!s) return null;
  if(CH2Z[s]) return CH2Z[s]; if(MJ2[s]) return MJ2[s];
  s=s.replace(/\s/g,'').toLowerCase().replace(/^赤/,'r').replace(/^red/,'r');
  let m=s.match(/^r?([0-9])([mpsz])r?$/); if(!m){const m2=s.match(/^([mpsz])([0-9])$/); if(m2) m=[s,m2[2],m2[1]];}
  if(!m) return null; let n=parseInt(m[1],10), su=m[2];
  if(su==='z') return (n>=1&&n<=7)? n+'z':null;
  if(n===0||(/r/.test(s)&&n===5)) return '0'+su;
  return (n>=1&&n<=9)? n+su:null; }
function normList(a){ return Array.isArray(a)? a.map(normTile).filter(Boolean):[]; }
const SO={m:0,p:1,s:2,z:3};
const tkey=t=>SO[t[1]]*100+(t[0]==='0'?5:parseInt(t[0],10))*10+(t[0]==='0'?1:0);
const sortTiles=a=>a.slice().sort((x,y)=>tkey(x)-tkey(y));
function tileName(t){ if(!t) return '―'; const s=t[1],n=t[0];
  if(s==='z') return HONOR[+n];
  const j={m:'萬',p:'筒',s:'索'}[s]; return n==='0'? '赤5'+j : n+j; }
const loose=t=>t? (t[0]==='0'? '5'+t[1]:t):t;

/* ---- 牌の画像（Mortal と同じ CC0 素材: FluffyStuff/riichi-mahjong-tiles Regular） ----
   本家（mjai.ekyu.moe）と同じ見た目にするため、寸法と色味も本家CSSに合わせている
   ・牌全体 34 : 42(=絵柄30x40 + 余白2px)  ・角丸4px  ・地色 白 + brightness(92%) saturate(80%)
------------------------------------------------------------------------------------ */
const TILEDIR='tiles/';
const TILE_AR=44/34, TILE_PAD=2/34, TILE_R=4/34;
const tileURL=code=>TILEDIR+code+'.svg';
// HTML用
function tileSVG(code){ return `<img class="tile" src="${tileURL(code)}" alt="${esc(tileName(code))}" loading="lazy">`; }
function tilesHTML(list,st){ return `<div class="tstatic" ${st?'style="'+st+'"':''}>`+list.map(t=>`<div class="tw">${tileSVG(t)}</div>`).join('')+`</div>`; }
// 卓図（SVG）用: 任意位置・サイズ・回転で牌を置く
function put(t,x,y,w,rot,extra,tsu){
  const h=w*TILE_AR, p=w*TILE_PAD, iw=w-2*p, ih=iw*4/3, r=w*TILE_R, u=tileURL(t);
  return `<g transform="translate(${x},${y})${rot?` rotate(${rot} ${w/2} ${h/2})`:''}">`
    + `<rect width="${w}" height="${h}" rx="${r}" fill="${tsu?'#bfb0a0':'#ebebeb'}"/>`
    + `<image${tsu?' class="tsu"':''} href="${u}" xlink:href="${u}" x="${p}" y="${p}" width="${iw}" height="${ih}"/>`
    + `<rect x="${r*0.12}" y="${r*0.12}" width="${w-r*0.24}" height="${h-r*0.24}" rx="${r}" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="${Math.max(.6,w*0.022)}"/>`
    + (extra||'') + `</g>`;
}
function putBack(x,y,w,rot){ return put('back',x,y,w,rot); }

/* ========================= 保存（IndexedDB + localStorage の二重保存） =========================
   ・全レコードをメモリに読み込んで動作させ、変更は IndexedDB と localStorage の両方へ書く
   ・片方が使えない／消えても、もう片方から自動復元する
   ・取り込み元URLと学習状況は別枠でも保存し、最悪の場合もワンタップで作り直せる
============================================================================================ */
const DBN='mahjong-quiz', STORE='problems';
const LS_DB='mq.db.v1', LS_STAT='mq.stat.v1', LS_SRC='mq.src.v1';
let _db=null, MEM=new Map(), DIRTY=new Set(), DELETED=new Set(), saveTimer=null;
const DIAG={idb:'未確認', ls:'未確認', persisted:null, lastSaveAt:null, lastError:null, restored:0, quota:null, usage:null};

function idbOpen(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    let r; try{ r=indexedDB.open(DBN,1); }catch(e){ return rej(e); }
    r.onupgradeneeded=e=>{ const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:'id'}); };
    r.onsuccess=()=>{ _db=r.result;
      _db.onclose=()=>{ _db=null; };
      _db.onversionchange=()=>{ try{_db.close()}catch(e){} _db=null; };
      res(_db); };
    r.onerror=()=>rej(r.error||new Error('open failed'));
    r.onblocked=()=>rej(new Error('blocked'));
  });
}
function idbTx(mode,fn){
  return idbOpen().then(d=>new Promise((res,rej)=>{
    let tx; try{ tx=d.transaction(STORE,mode); }catch(e){ _db=null; return rej(e); }
    let out; try{ out=fn(tx.objectStore(STORE)); }catch(e){ return rej(e); }
    tx.oncomplete=()=>res(out&&typeof out==='object'&&'result' in out? out.result : out);
    tx.onerror=()=>rej(tx.error||new Error('tx error'));
    tx.onabort=()=>rej(tx.error||new Error('tx abort'));
  }));
}
// 接続が閉じられていた場合に1度だけ開き直して再試行する
function idbTry(mode,fn){
  return idbTx(mode,fn).catch(e=>{ _db=null; return idbTx(mode,fn); });
}
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ DIAG.lastError='LS: '+(e.message||e); return false; } }

function mergeRec(r){
  if(!r||!r.id) return;
  const cur=MEM.get(r.id);
  if(!cur){ MEM.set(r.id,r); return; }
  const ta=cur.updatedAt||cur.lastAnsweredAt||cur.createdAt||0;
  const tb=r.updatedAt||r.lastAnsweredAt||r.createdAt||0;
  const win=Object.assign({}, tb>=ta? r : cur);
  if(!win.image && (cur.image||r.image)) win.image=cur.image||r.image;
  MEM.set(r.id,win);
}
async function loadAll(){
  let fromIdb=[], fromLs=[];
  try{ fromIdb=(await idbTry('readonly',st=>st.getAll()))||[]; DIAG.idb='OK（'+fromIdb.length+'件）'; }
  catch(e){ DIAG.idb='使用不可（'+(e.message||e)+'）'; }
  try{ fromLs=lsGet(LS_DB,[])||[]; DIAG.ls='OK（'+fromLs.length+'件）'; }
  catch(e){ DIAG.ls='使用不可'; }
  MEM=new Map();
  fromLs.forEach(mergeRec); fromIdb.forEach(mergeRec);
  // 学習状況の軽量バックアップで上書き補完
  const stat=lsGet(LS_STAT,{})||{};
  MEM.forEach(r=>{ const t=stat[r.id];
    if(t && (t[4]||0)>(r.lastAnsweredAt||0)){ r.status=t[0]; r.review=!!t[1]; r.correctCount=t[2]||0; r.wrongCount=t[3]||0; r.lastAnsweredAt=t[4]||null; } });
  // 片方にしか無いレコードは書き戻す
  const inIdb=new Set(fromIdb.map(r=>r.id)), inLs=new Set(fromLs.map(r=>r.id));
  let need=false;
  MEM.forEach(r=>{ if(!inIdb.has(r.id)||!inLs.has(r.id)){ DIRTY.add(r.id); need=true; } });
  DIAG.restored=Math.max(0, MEM.size-fromIdb.length);
  if(need) flush();
  try{ if(navigator.storage&&navigator.storage.estimate){ const e=await navigator.storage.estimate(); DIAG.usage=e.usage; DIAG.quota=e.quota; } }catch(e){}
}
function saveSoon(ms){ clearTimeout(saveTimer); saveTimer=setTimeout(flush, ms==null?350:ms); }
async function flush(){
  clearTimeout(saveTimer);
  const recs=[...MEM.values()];
  const stat={}; recs.forEach(r=>{ stat[r.id]=[r.status,r.review?1:0,r.correctCount||0,r.wrongCount||0,r.lastAnsweredAt||0]; });
  lsSet(LS_STAT,stat);
  if(lsSet(LS_DB, recs.map(r=>{ const c=Object.assign({},r); delete c.image; return c; }))) DIAG.ls='OK（'+recs.length+'件）';
  else DIAG.ls='書き込み失敗（容量超過など）';
  const ids=[...DIRTY], dels=[...DELETED];
  if(ids.length||dels.length){
    try{
      await idbTry('readwrite',st=>{ ids.forEach(id=>{ const r=MEM.get(id); if(r) st.put(r); }); dels.forEach(id=>st.delete(id)); });
      DIRTY.clear(); DELETED.clear(); DIAG.lastSaveAt=Date.now(); DIAG.idb='OK（'+MEM.size+'件）';
    }catch(e){ DIAG.lastError='IDB: '+(e.message||e); DIAG.idb='書き込み失敗（'+(e.message||e)+'）'; }
  } else DIAG.lastSaveAt=Date.now();
}
const dbAll=async()=>[...MEM.values()];
const dbGet=async id=>MEM.get(id);
const dbPut=async r=>{ r.updatedAt=Date.now(); MEM.set(r.id,r); DIRTY.add(r.id); DELETED.delete(r.id); saveSoon(); return r; };
const dbDel=async id=>{ MEM.delete(id); DIRTY.delete(id); DELETED.add(id); saveSoon(0); };
const dbClear=async()=>{ MEM.forEach((v,k)=>DELETED.add(k)); MEM.clear(); DIRTY.clear();
  try{ localStorage.removeItem(LS_DB); localStorage.removeItem(LS_STAT); }catch(e){} await flush(); };
// 取り込み元URLの控え（データが消えてもワンタップで復元できる）
const getSources=()=>lsGet(LS_SRC,[])||[];
// 取り込んだ問題を保存する（既存なら学習状況を維持したまま中身だけ最新化）
async function upsertProblem(p,cur){
  if(!cur) return (await dbPut(applySavedStatus(p)), 'added');
  const keepExpl=(cur.q&&cur.q.explanation)||'';
  cur.st=p.st;
  cur.q=Object.assign({},p.q,{explanation:keepExpl||p.q.explanation||''});
  cur.srcUrl=p.srcUrl||cur.srcUrl; cur.reportId=p.reportId||cur.reportId;
  cur.seq=(p.seq!=null?p.seq:cur.seq);
  await dbPut(cur);
  return 'updated';
}
// 取り込み直したレコードに、残っている学習状況を復元する
function applySavedStatus(r){
  const t=(lsGet(LS_STAT,{})||{})[r.id];
  if(t){ r.status=t[0]||'new'; r.review=!!t[1]; r.correctCount=t[2]||0; r.wrongCount=t[3]||0; r.lastAnsweredAt=t[4]||null; }
  return r;
}
function addSource(src){
  const l=getSources().filter(x=>x.reportId!==src.reportId);
  l.unshift(src); lsSet(LS_SRC,l.slice(0,80));
}
async function askPersist(){
  try{
    if(!navigator.storage) return;
    if(navigator.storage.persisted) DIAG.persisted=await navigator.storage.persisted();
    if(!DIAG.persisted && navigator.storage.persist) DIAG.persisted=await navigator.storage.persist();
  }catch(e){}
}
// 離脱・バックグラウンド時に取りこぼしを書き切る
addEventListener('pagehide',()=>{ try{ flush(); }catch(e){} });
addEventListener('beforeunload',()=>{ try{ flush(); }catch(e){} });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ try{ flush(); }catch(e){} } });

const CFG={
  get key(){return localStorage.getItem('mq.apikey')||''}, set key(v){localStorage.setItem('mq.apikey',v)},
  get model(){return localStorage.getItem('mq.model')||'claude-opus-5'}, set model(v){localStorage.setItem('mq.model',v)},
  get proxy(){return localStorage.getItem('mq.proxy')||''}, set proxy(v){localStorage.setItem('mq.proxy',v)},
  get lastUrl(){return localStorage.getItem('mq.lasturl')||''}, set lastUrl(v){localStorage.setItem('mq.lasturl',v)}
};

/* ========================= Mortal レポート取り込み ========================= */
function reportUrlFrom(input){
  let s=(input||'').trim();
  if(!s) throw new Error('URLを入力してください');
  if(/^\//.test(s)) return 'https://mjai.ekyu.moe'+s;
  let u; try{ u=new URL(s); }catch(e){ throw new Error('URLの形式が正しくありません'); }
  const d=u.searchParams.get('data');
  if(d) return new URL(d,u.origin).href;
  if(/\.json($|\?)/i.test(u.pathname)) return u.href;
  throw new Error('レポートURL（?data=/report/xxxx.json）を貼り付けてください');
}
const PROXIES=[
  u=>'https://r.jina.ai/'+u,
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),
  u=>u
];
function pickJSON(text){
  const i=text.indexOf('{'), j=text.lastIndexOf('}');
  if(i<0||j<0) throw new Error('JSONではありません');
  return JSON.parse(text.slice(i,j+1));
}
async function fetchReport(url,onStep){
  const list=[]; if(CFG.proxy) list.push(u=>CFG.proxy.replace('{url}',encodeURIComponent(u)).replace('{raw}',u));
  list.push(...PROXIES);
  let lastErr=null;
  for(let i=0;i<list.length;i++){
    const target=list[i](url);
    onStep&&onStep(`取得中…（経路 ${i+1}/${list.length}）`);
    try{
      const r=await fetch(target,{headers:{'accept':'application/json,text/plain,*/*'}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const t=await r.text();
      const j=pickJSON(t);
      if(!j.review||!Array.isArray(j.review.kyokus)) throw new Error('Mortalのレポートではありません');
      return j;
    }catch(e){ lastErr=e; }
  }
  throw new Error('レポートを取得できませんでした（'+(lastErr&&lastErr.message)+'）。設定タブで自前のCORSプロキシを指定するか、JSONファイルを直接読み込んでください。');
}

/* mjaiログを再生して、打牌／鳴き の各判断ポイントの状態を完全復元する */
function replay(rep){
  const PID=rep.player_id|0, log=rep.mjai_log||[];
  const names=(log[0]&&log[0].names)||['自分','下家','対面','上家'];
  const out=[]; let st=null, ki=-1;
  const rel=a=>((a-PID)%4+4)%4;
  const snapshot=()=>({
    bakaze:st.bakaze,kyoku:st.kyoku,honba:st.honba,oyaRel:rel(st.oya),
    dora:st.dora.map(cvMjai).filter(Boolean),
    scores:[0,1,2,3].map(r=>st.scores[(PID+r)%4]),
    rivers:st.rivers.map(x=>x.map(o=>({pai:cvMjai(o.pai),t:o.tsumogiri?1:0,r:o.riichi?1:0}))),
    riichi:st.riichi.slice(),
    fuuros:st.fuuros.map(f=>f.map(m=>({type:m.type,tiles:(m.consumed||[]).concat(m.pai?[m.pai]:[]).map(cvMjai).filter(Boolean)}))),
    handRaw:st.hand.slice(), drawn:st.drawn, left:st.left,
    names:[0,1,2,3].map(r=>names[(PID+r)%4])
  });
  for(const ev of log){
    if(ev.type==='start_kyoku'){
      ki++;
      st={ki,bakaze:ev.bakaze,kyoku:ev.kyoku,honba:ev.honba,oya:ev.oya,
          scores:ev.scores.slice(),dora:[ev.dora_marker],rivers:[[],[],[],[]],riichi:[0,0,0,0],
          fuuros:[[],[],[],[]],hand:(ev.tehais[PID]||[]).slice(),drawn:null,pending:-1,left:70};
      continue;
    }
    if(!st) continue;
    if(ev.type==='dora'){ st.dora.push(ev.dora_marker); continue; }
    if(ev.type==='tsumo'){ st.left=Math.max(0,st.left-1); if(ev.actor===PID){st.hand.push(ev.pai);st.drawn=ev.pai;} continue; }
    if(ev.type==='reach'){ st.pending=ev.actor; continue; }
    if(ev.type==='reach_accepted'){ st.riichi[rel(ev.actor)]=1; continue; }
    if(ev.type==='dahai'){
      // 自分の打牌／リーチ判断のポイント（切る前）
      if(ev.actor===PID){
        out.push({ki, kind:'discard', snap:snapshot()});
        const k=st.hand.indexOf(ev.pai); if(k>=0) st.hand.splice(k,1); st.drawn=null;
      }
      st.rivers[rel(ev.actor)].push({pai:ev.pai,tsumogiri:ev.tsumogiri,riichi:st.pending===ev.actor});
      if(st.pending===ev.actor) st.pending=-1;
      // 他家の打牌 → 自分の鳴き判断のポイント（捨て牌を河に置いた状態）
      if(ev.actor!==PID){
        const sn=snapshot(); sn.callRel=rel(ev.actor); sn.callTile=cvMjai(ev.pai);
        out.push({ki, kind:'call', snap:sn});
      }
      continue;
    }
    if(['chi','pon','daiminkan','kakan','ankan'].indexOf(ev.type)>=0){
      const cons=ev.consumed||[];
      if(ev.actor===PID){
        cons.forEach(c=>{const k=st.hand.indexOf(c); if(k>=0) st.hand.splice(k,1);});
        if((ev.type==='kakan'||ev.type==='ankan')&&ev.pai){const k=st.hand.indexOf(ev.pai); if(k>=0) st.hand.splice(k,1);}
        st.drawn=null;
      }
      if(ev.type!=='ankan'&&ev.type!=='kakan'&&ev.target!=null){ const rr=rel(ev.target); if(st.rivers[rr].length) st.rivers[rr].pop(); }
      st.fuuros[rel(ev.actor)].push({type:ev.type,pai:ev.pai,consumed:cons});
      continue;
    }
  }
  return out;
}
/* 行動の日本語表記 */
function actionText(a){
  if(!a) return '―';
  const t=x=>tileName(cvMjai(x));
  const cons=(a.consumed||[]).map(t).join('・');
  switch(a.type){
    case 'dahai': return '打 '+t(a.pai)+(a.tsumogiri?'（ツモ切り）':'');
    case 'none': return 'スルー（鳴かない）';
    case 'chi': return 'チー（手牌の '+cons+'）';
    case 'pon': return 'ポン（手牌の '+cons+'）';
    case 'daiminkan': return '大明カン';
    case 'ankan': return '暗カン（'+cons+'）';
    case 'kakan': return '加カン（'+t(a.pai)+'）';
    case 'reach': return 'リーチ';
    case 'hora': return (a.actor===a.target?'ツモ和了':'ロン和了');
    case 'ryukyoku': return '九種九牌で流局';
    default: return a.type;
  }
}
const msKey=a=>a.slice().sort().join(',');
function extractProblems(rep,srcUrl,reportId){
  const snaps=replay(rep);
  const byK={}; snaps.forEach(x=>{(byK[x.ki]=byK[x.ki]||[]).push(x);});
  const probs=[]; const impAt=Date.now();
  const PID=rep.player_id|0, rel=a=>((a-PID)%4+4)%4;
  rep.review.kyokus.forEach((k,ki)=>{
    const list=byK[ki]||[]; let ptr=0;
    k.entries.forEach((e,ei)=>{
      if(!e.expected||!e.actual||!e.state) return;
      const want=msKey((e.state.tehai||[]).map(cvMjai).filter(Boolean));
      const isDiscard=[e.expected.type,e.actual.type].some(t=>t==='dahai'||t==='reach');
      const wantRel=(e.last_actor!=null)? rel(e.last_actor):null, wantTile=cvMjai(e.tile);
      // 手牌・判断の種別・対象牌の一致度が最も高いスナップショットを選ぶ
      let found=-1, best=-1;
      for(let i=ptr;i<Math.min(list.length,ptr+12);i++){
        const it=list[i];
        if(msKey(it.snap.handRaw.map(cvMjai).filter(Boolean))!==want) continue;
        let sc=0;
        if((it.kind==='discard')===isDiscard) sc+=2;
        if(it.kind==='call'){ if(wantRel!=null&&it.snap.callRel===wantRel) sc+=3;
                              if(wantTile&&it.snap.callTile===wantTile) sc+=3; }
        else if(wantTile&&it.snap.drawn&&cvMjai(it.snap.drawn)===wantTile) sc+=3;
        if(sc>best){ best=sc; found=i; }
        if(sc>=8) break;
      }
      if(found<0) return;
      ptr=found+1;
      if(e.is_equal) return;
      const item=list[found], snap=item.snap;
      const kind = item.kind==='call' ? 'call'
                 : ([e.expected.type,e.actual.type].indexOf('reach')>=0 ? 'riichi' : 'dahai');
      const cands=(e.details||[]).filter(d=>d.action).map(d=>({
        tile: d.action.type==='dahai'? cvMjai(d.action.pai):null,
        type: d.action.type, text: actionText(d.action), prob: d.prob, q: d.q_value
      })).slice(0,16);
      const answer=e.expected.type==='dahai'? cvMjai(e.expected.pai):null;
      const actual=e.actual.type==='dahai'? cvMjai(e.actual.pai):null;
      const drawn=cvMjai(snap.drawn);
      let hand=snap.handRaw.map(cvMjai).filter(Boolean);
      if(drawn){ const i=hand.indexOf(drawn); if(i>=0) hand.splice(i,1); }
      hand=sortTiles(hand);
      const topP=cands.length?cands[0].prob:null;
      const actC=cands.find(c=>c.type===e.actual.type && (c.tile==null||c.tile===actual));
      probs.push({
        id:reportId+'-'+ki+'-'+ei, createdAt:impAt, seq:probs.length, src:'mortal', srcUrl, reportId,
        st:{roundText:(snap.bakaze==='E'?'東':snap.bakaze==='S'?'南':'西')+snap.kyoku+'局', oyaRel:snap.oyaRel,
            honba:snap.honba, seatText:['東家','南家','西家','北家'][(4-snap.oyaRel)%4],
            junme:e.junme, left:(e.tiles_left!=null?e.tiles_left:snap.left), dora:snap.dora,
            scores:snap.scores, riichi:snap.riichi, rivers:snap.rivers, fuuros:snap.fuuros,
            hand, drawn, names:snap.names,
            callRel:(snap.callRel!=null?snap.callRel:null), callTile:snap.callTile||null},
        q:{kind, answer, actual,
           answerText:actionText(e.expected), actualText:actionText(e.actual),
           answerType:e.expected.type, actualType:e.actual.type,
           answerConsumed:(normList(e.expected.consumed).length?normList(e.expected.consumed):null),
           candidates:cands, shanten:(e.shanten==null?null:e.shanten), furiten:!!e.at_furiten,
           severity:(topP!=null&&actC&&actC.prob!=null)?(topP-actC.prob):null, explanation:''},
        status:'new', review:false, attempts:0, correctCount:0, wrongCount:0, lastAnsweredAt:null
      });
    });
  });
  return probs;
}

// 問題文（打牌／リーチ／鳴き）
function questionText(rec){
  const q=rec.q||{}, st=rec.st||{};
  if(q.kind==='call'){
    const who=['自分','下家','対面','上家'][st.callRel||0];
    return who+'の '+tileName(st.callTile)+'、鳴く？';
  }
  if(q.kind==='riichi') return 'リーチする？　何を切る？';
  return '何を切る？';
}
const W=720;
function riverBlock(list,cx,cy,rot,tw,markLast){
  const cols=6, gap=2, th=tw*TILE_AR;
  const rows=Math.max(1,Math.ceil(list.length/cols));
  const bw=cols*(tw+gap)-gap, bh=rows*(th+gap)-gap;
  let s=`<g transform="translate(${cx},${cy}) rotate(${rot}) translate(${-bw/2},${-bh/2})">`;
  list.forEach((o,i)=>{
    const c=i%cols, r=Math.floor(i/cols);
    const x=c*(tw+gap), y=r*(th+gap);
    const mark=(markLast&&i===list.length-1)
      ? `<rect x="-2.5" y="-2.5" width="${tw+5}" height="${th+5}" rx="6" fill="none" stroke="${markLast}" stroke-width="3.5"/>` : '';
    s+=put(o.pai,x,y,tw,o.r?90:0,mark,o.t);
  });
  return s+'</g>';
}
function meldGroup(f,x,y,tw){
  let s='', cx=x;
  f.forEach(m=>{ m.tiles.forEach(t=>{ s+=put(t,cx,y,tw,0); cx+=tw+1; }); cx+=5; });
  return s;
}
function boardSVG(rec,reveal){
  const st=rec.st, q=rec.q;
  const hand=st.hand||[], drawn=st.drawn;
  const all=drawn? hand.concat([drawn]):hand.slice();
  const H=800;
  const myWind=(4-((st.oyaRel!=null)?st.oyaRel:0))%4;
  const wd=['東','南','西','北'];
  let s=`<svg class="board" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">`;
  s+=`<rect width="${W}" height="${H}" rx="14" fill="#0d4247"/>`;
  // ドラ表示
  if(st.dora&&st.dora.length){
    s+=`<text x="58" y="38" font-size="17" fill="#9dc4c4" font-family="sans-serif">ドラ表示</text>`;
    st.dora.slice(0,5).forEach((t,i)=> s+=put(t,132+i*36,6,32,0));
  }
  s+=`<text x="662" y="38" text-anchor="end" font-size="16" fill="#9dc4c4" font-family="sans-serif">残り${st.left!=null?st.left+'枚':'―'}</text>`;
  // 卓
  s+=`<rect x="56" y="60" width="608" height="480" rx="10" fill="#0a3438" stroke="#17555c"/>`;
  // 中央
  s+=`<rect x="272" y="255" width="176" height="100" rx="8" fill="#0f4a50" stroke="#2b7d85"/>`;
  s+=`<text x="360" y="296" text-anchor="middle" font-size="27" font-weight="700" fill="#eaf6f5" font-family="sans-serif">${esc(st.roundText||'')}</text>`;
  s+=`<text x="360" y="320" text-anchor="middle" font-size="15" fill="#9dc4c4" font-family="sans-serif">${st.honba?st.honba+'本場 ':''}${st.junme?st.junme+'巡目':''}</text>`;
  const sc=st.scores||[0,0,0,0];
  const sp=[[360,378],[478,312],[360,240],[242,312]];
  sp.forEach((p,i)=>{
    if(!sc[i]&&i) return;
    s+=`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="15" fill="${i?'#9dc4c4':'#ffd166'}" font-family="sans-serif">${wd[(myWind+i)%4]} ${sc[i]||''}</text>`;
  });
  // リーチ棒
  (st.riichi||[]).forEach((r,i)=>{ if(!r) return;
    const pos=[[336,388,0],[462,290,90],[336,222,0],[258,290,90]][i];
    s+=`<g transform="translate(${pos[0]},${pos[1]}) rotate(${pos[2]})"><rect width="48" height="7" rx="3.5" fill="#f2f2f2"/><circle cx="24" cy="3.5" r="2.6" fill="#e03131"/></g>`;
  });
  // 河
  const riv=st.rivers||[[],[],[],[]];
  const callMark=(st.callRel!=null)
    ? (reveal ? (q.answerType&&q.answerType!=='none' ? '#3ddc97' : '#ff6b6b') : '#ffd166') : null;
  const mk=i=>(st.callRel===i? callMark : null);
  s+=riverBlock(riv[2].slice(0,24),360,155,180,30,mk(2));
  s+=riverBlock(riv[0].slice(0,24),360,448,0,30,null);
  s+=riverBlock(riv[3].slice(0,24),150,305,90,30,mk(3));
  s+=riverBlock(riv[1].slice(0,24),570,305,270,30,mk(1));
  // 副露（他家）
  const fu=st.fuuros||[[],[],[],[]];
  if(fu[2]&&fu[2].length) s+=meldGroup(fu[2],440,66,26);
  if(fu[3]&&fu[3].length) s+=meldGroup(fu[3],62,466,26);
  if(fu[1]&&fu[1].length) s+=meldGroup(fu[1],470,466,26);
  // 自分の手牌
  const tw=46, th=tw*TILE_AR, hy=640, gap=2, n=all.length;
  const totalW=n*(tw+gap)-gap+(drawn?14:0);
  let x0=(W-totalW)/2; const xs=[];
  for(let i=0;i<n;i++){ xs.push(x0); x0+=tw+gap+((drawn&&i===n-2)?14:0); }
  // 推奨バー（答え表示時のみ）
  if(reveal&&q.candidates&&q.candidates.length){
    const maxP=Math.max.apply(null,q.candidates.map(c=>c.prob||0))||1;
    const used={};
    all.forEach((t,i)=>{
      const c=q.candidates.find(c=>c.tile===t&&!used[c.tile]);
      if(!c||!(c.prob>0.0005)) return; used[c.tile]=1;
      const hgt=Math.max(4,(c.prob/maxP)*78), top=hy-10-hgt, isTop=(t===q.answer);
      s+=`<rect x="${xs[i]+tw/2-9}" y="${top}" width="18" height="${hgt}" rx="3" fill="${isTop?'#4ade80':'#2f8f63'}"/>`;
      if(c.prob>=0.02) s+=`<text x="${xs[i]+tw/2}" y="${top-6}" text-anchor="middle" font-size="15" fill="#cfeee0" font-family="sans-serif">${Math.round(c.prob*100)}%</text>`;
    });
  }
  let ansDone=0, actDone=0;
  const needCons=(reveal&&q.answerConsumed)? q.answerConsumed.slice():[];
  const ringG=`<rect x="-3" y="-3" width="${tw+6}" height="${th+6}" rx="8" fill="none" stroke="#3ddc97" stroke-width="4"/>`;
  const ringR=`<rect x="-3" y="-3" width="${tw+6}" height="${th+6}" rx="8" fill="none" stroke="#ff6b6b" stroke-width="4"/>`;
  all.forEach((t,i)=>{
    let extra='';
    if(reveal){
      const ci=needCons.indexOf(t);
      if(t===q.answer&&!ansDone){ ansDone=1; extra=ringG; }
      else if(ci>=0){ needCons.splice(ci,1); extra=ringG; }
      else if(t===q.actual&&t!==q.answer&&!actDone){ actDone=1; extra=ringR; }
    }
    s+=put(t,xs[i],hy,tw,0,extra);
  });
  s+=`<text x="24" y="${hy-14}" font-size="17" fill="#9dc4c4" font-family="sans-serif">自分（${wd[myWind]}家）${drawn?'　└ ツモ':''}</text>`;
  if(st.callRel!=null&&st.callTile){
    const who=['自分','下家','対面','上家'][st.callRel];
    s+=`<text x="${W-24}" y="${hy-14}" text-anchor="end" font-size="17" fill="#ffd166" font-family="sans-serif">${who}が ${esc(tileName(st.callTile))} を切った</text>`;
  }
  // 自分の副露
  if(fu[0]&&fu[0].length) s+=meldGroup(fu[0],430,712,26);
  const ly=hy+th+34;
  if(reveal){
    s+=`<text x="24" y="${ly}" font-size="19" font-weight="700" fill="#3ddc97" font-family="sans-serif">推奨 ${esc(q.answerText||tileName(q.answer))}</text>`;
    s+=`<text x="24" y="${ly+26}" font-size="19" fill="#ff9b9b" font-family="sans-serif">実戦 ${esc(q.actualText||tileName(q.actual))}</text>`;
  } else {
    s+=`<text x="24" y="${ly}" font-size="20" font-weight="700" fill="#ffd166" font-family="sans-serif">${esc(questionText(rec))}</text>`;
  }
  return s+'</svg>';
}

/* ---------- クイズ ---------- */
let QUIZ=null; // {rec, reveal, mode}
const MODES={
  auto:  {label:'おまかせ', desc:'不正解 → 要復習 → 未出題 の順', f:null},
  wrong: {label:'不正解だけ', desc:'間違えた問題だけを出題', f:r=>r.status==='wrong'},
  review:{label:'要復習だけ', desc:'要復習にした問題だけを出題', f:r=>!!r.review},
  new:   {label:'未出題だけ', desc:'まだ解いていない問題だけを出題', f:r=>r.status!=='wrong'&&r.status!=='correct'},
  correct:{label:'正解済みだけ', desc:'正解した問題の解き直し', f:r=>r.status==='correct'}
};
function pickFrom(pool,prevId){
  const c=pool.filter(r=>r.id!==prevId);
  if(!c.length) return null;
  c.sort((a,b)=>(a.lastAnsweredAt||0)-(b.lastAnsweredAt||0));
  const head=c.slice(0,Math.max(1,Math.ceil(c.length*0.4)));
  return head[Math.floor(Math.random()*head.length)];
}
const srcKey=r=>r.reportId||('image:'+(r.src||''));
async function pickNext(prevId,mode,src){
  let all=await dbAll();
  if(src) all=all.filter(r=>srcKey(r)===src);
  if(!all.length) return null;
  const m=MODES[mode]||MODES.auto;
  if(m.f) return pickFrom(all.filter(m.f),prevId);   // 指定リストの中だけで出題（尽きたら null）
  const pools=[ all.filter(r=>r.status==='wrong'),
                all.filter(r=>r.review&&r.status!=='wrong'),
                all.filter(r=>r.status!=='correct'&&r.status!=='wrong'&&!r.review) ];
  for(const p of pools){ const r=pickFrom(p,prevId); if(r) return r; }
  let c=all.filter(r=>r.id!==prevId); if(!c.length) c=all;
  return c[Math.floor(Math.random()*c.length)];
}
function poolLabel(r){
  if(r.status==='wrong') return '<span class="badge b-wrong">不正解リストから</span>';
  if(r.review) return '<span class="badge b-review">要復習リストから</span>';
  if(r.status==='correct') return '<span class="badge b-correct">復習（正解済み）</span>';
  return '<span class="badge b-new">未出題から</span>';
}

function candListHTML(q){
  const cs=(q.candidates||[]).filter(c=>c.prob>=0.005).slice(0,6);
  if(!cs.length) return '';
  const max=cs[0].prob||1;

function fileToImage(f){return new Promise((res,rej)=>{const fr=new FileReader();

function imgURL(im,max,q){const sc=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);

function imgBlock(u){const m=u.match(/^data:([^;]+);base64,(.*)$/);return {type:'image',source:{type:'base64',media_type:m[1],data:m[2]}};}
async function callClaude(blocks,mx){

const IMG_PROMPT=`麻雀の牌譜検討画面（Mortal等）のスクリーンショットです。次を読み取ってJSONだけ出力してください。
画面下部の横一列が自分の手牌で、少し離れた右端の1枚がツモ牌です。牌の上の緑の縦棒はAIの推奨度で、最も高い牌がAIの推奨打牌。赤枠は実際に打たれた牌です。
表記: 1m..9m(萬) 1p..9p(筒) 1s..9s(索) 1z=東 2z=南 3z=西 4z=北 5z=白 6z=發 7z=中 赤5は0m/0p/0s
{"isMahjong":true,"roundText":"東1局","honba":0,"seatText":"東家","junme":6,
"dora":["3s"],"hand":["3m","4m"],"drawn":"5p","answer":"1s","actual":"1s",
"melds":[["3m","4m","5m"]],"discards":{"self":[],"shimocha":[],"toimen":[],"kamicha":[]},
"scores":{"self":25000,"shimocha":25000,"toimen":25000,"kamicha":25000},"explanation":"..."}`;
function pj(t){const s=t.trim().replace(/^\`\`\`(?:json)?/i,'').replace(/\`\`\`$/,'');
  const a=s.indexOf('{'),b=s.lastIndexOf('}'); if(a<0)throw new Error('JSONを取り出せません'); return JSON.parse(s.slice(a,b+1));}
async function analyzeImage(file,onStep){
  onStep&&onStep('画像を準備中…');
  const im=await fileToImage(file), full=imgURL(im,1568,.9);
  onStep&&onStep('Claudeが解析中…');

  if(A.isMahjong===false) throw new Error('麻雀の画面として認識できませんでした');
  let hand=normList(A.hand), drawn=normTile(A.drawn), answer=normTile(A.answer), actual=normTile(A.actual);
  if(!hand.length) throw new Error('手牌を読み取れませんでした');
  const all=drawn?hand.concat([drawn]):hand.slice();
  if(answer&&all.indexOf(answer)<0) answer=all.find(t=>loose(t)===loose(answer))||null;
  if(!answer) answer=actual||all[all.length-1];
  const rv=t=>normList(t).map(p=>({pai:p,t:0,r:0}));
  const d=A.discards||{}, s=A.scores||{};
  const orMap={'東家':0,'南家':3,'西家':2,'北家':1};
  return {image:full, st:{roundText:A.roundText||'',honba:A.honba||0,seatText:A.seatText||'',oyaRel:(orMap[A.seatText]||0),junme:A.junme||null,
      left:null,dora:normList(A.dora),scores:[s.self||0,s.shimocha||0,s.toimen||0,s.kamicha||0],riichi:[0,0,0,0],
      rivers:[rv(d.self),rv(d.shimocha),rv(d.toimen),rv(d.kamicha)],
      fuuros:[(A.melds||[]).map(m=>({type:'',tiles:normList(m)})),[],[],[]],
      hand:sortTiles(hand),drawn,names:['自分','下家','対面','上家']},
    q:{answer,actual,candidates:answer?[{tile:answer,prob:1}]:[],shanten:null,furiten:false,
       actualType:'dahai',expectedType:'dahai',severity:null,explanation:A.explanation||''}};
}
function drawQueue(){

  }).join('');
  $$('[data-save]',box).forEach(b=>b.addEventListener('click',async()=>{

      st:q.result.st,q:q.result.q,status:'new',review:false,attempts:0,correctCount:0,wrongCount:0,lastAnsweredAt:null});

  }));
  $$('[data-drop]',box).forEach(b=>b.addEventListener('click',()=>{QUEUE=QUEUE.filter(x=>x.id!==b.dataset.drop);drawQueue();}));
  $$('[data-retry]',box).forEach(b=>b.addEventListener('click',()=>{

async function runQueue(){
  if(running) return; running=true;
  try{ while(true){
    const q=QUEUE.slice().reverse().find(x=>x.state==='wait'); if(!q) break;
    q.state='work'; q.msg='解析中…'; drawQueue();
    try{ q.result=await analyzeImage(q.file,m=>{q.msg=m;drawQueue();}); q.state='done'; }
    catch(e){ q.state='error'; q.error=e.message||String(e); }
    drawQueue();
  }} finally{ running=false; }
}

async function renderList(){

  const items=all.filter(F[FILTER]);

  const mode = FILTER==='all'?'auto':FILTER;
  const body=[...gShow.keys()].map(k=>{
    const list=gShow.get(k), whole=gAll.get(k)||[], head=list[0];
    const c={wrong:0,review:0,new:0,correct:0};
    whole.forEach(r=>{ if(r.review)c.review++; if(r.status==='wrong')c.wrong++; else if(r.status==='correct')c.correct++; else c.new++; });
    return `<div class="group">
      <div class="ghead">
        <div class="row">
          <b>${esc(srcLabel(head))}</b>
          <span class="small muted">${new Date(head.createdAt).toLocaleDateString('ja-JP')}</span>
          <span class="grow"></span>
          <span class="small muted">${list.length}問</span>
        </div>
        <div class="row small" style="gap:10px;margin-top:2px">
          <span style="color:var(--bad)">不正解 ${c.wrong}</span>
          <span style="color:var(--review)">要復習 ${c.review}</span>
          <span>未出題 ${c.new}</span>
          <span style="color:var(--good)">正解 ${c.correct}</span>
        </div>
        <button class="btn-ghost btn-sm btn-block" data-q="${esc(k)}" style="margin-top:8px">
          この牌譜の「${esc(MODES[mode].label)}」を出題（${list.length}問）</button>
      </div>
      ${list.map(r=>`<div class="list-item" data-open="${esc(r.id)}">
        <div class="row" style="gap:6px;margin-bottom:4px">
          ${r.status==='wrong'?'<span class="badge b-wrong">不正解</span>':r.status==='correct'?'<span class="badge b-correct">正解</span>':'<span class="badge b-new">未出題</span>'}
          ${r.review?'<span class="badge b-review">要復習</span>':''}
          <span class="badge b-kind">${r.q.kind==='call'?'鳴き':r.q.kind==='riichi'?'リーチ':'何切る'}</span>
          <span class="small muted">${esc(r.st.roundText||'')} ${r.st.junme?r.st.junme+'巡目':''}</span>
        </div>
        ${tilesHTML((r.st.drawn?r.st.hand.concat([r.st.drawn]):r.st.hand).slice(0,14))}
      </div>`).join('')}
    </div>`;
  }).join('');
  view.innerHTML=`<div class="filters">
    <button data-f="all" class="${FILTER==='all'?'on':''}">全部 ${s.total}</button>
    <button data-f="wrong" class="${FILTER==='wrong'?'on':''}">不正解 ${s.wrong}</button>
    <button data-f="review" class="${FILTER==='review'?'on':''}">要復習 ${s.review}</button>
    <button data-f="new" class="${FILTER==='new'?'on':''}">未出題 ${s.new}</button>
    <button data-f="correct" class="${FILTER==='correct'?'on':''}">正解 ${s.correct}</button></div>
    ${body||'<p class="muted center">該当なし</p>'}`;
  $$('.filters button').forEach(b=>b.addEventListener('click',()=>{FILTER=b.dataset.f;renderList();}));
  $$('[data-open]').forEach(b=>b.addEventListener('click',()=>openDetail(b.dataset.open)));
  $$('[data-q]').forEach(b=>b.addEventListener('click',()=>{
    TAB='quiz'; $$('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='quiz'));
    startQuiz(mode,b.dataset.q);
  }));
}
async function openDetail(id){
  const r=await dbGet(id); if(!r) return;
  view.innerHTML=`<button class="btn-ghost btn-sm" id="back">← 一覧に戻る</button>
    <div class="card" style="margin-top:10px">
      <div class="row" style="margin-bottom:8px">
        ${r.status==='wrong'?'<span class="badge b-wrong">不正解</span>':r.status==='correct'?'<span class="badge b-correct">正解</span>':'<span class="badge b-new">未出題</span>'}
        ${r.review?'<span class="badge b-review">要復習</span>':''}<span class="grow"></span>
        <span class="small muted">${new Date(r.createdAt).toLocaleString('ja-JP')}</span></div>
      <div class="boardwrap">${boardSVG(r,true)}</div>
      ${candListHTML(r.q)}
      ${r.q.explanation?`<div class="expl">${esc(r.q.explanation)}</div>`:''}
      ${r.image?`<details><summary>元の画像</summary><img class="shot" src="${r.image}"></details>`:''}
      ${r.srcUrl?`<p class="small muted" style="margin-top:8px"><a href="${esc(r.srcUrl)}" target="_blank" rel="noopener">元の検討ページ</a></p>`:''}
      <div class="row" style="margin-top:12px">
        <button class="${r.review?'btn-warn':'btn-ghost'} grow" id="rev">${r.review?'★ 要復習を解除':'☆ 要復習にする'}</button>
        <button class="btn-ghost" id="reset">未出題に戻す</button></div>
      <button class="btn-danger btn-block btn-sm" id="del" style="margin-top:8px">削除</button>
    </div>`;
  $('#back').addEventListener('click',renderList);
  $('#rev').addEventListener('click',async()=>{r.review=!r.review;await dbPut(r);openDetail(id);});
  $('#reset').addEventListener('click',async()=>{r.status='new';await dbPut(r);toast('未出題に戻しました');openDetail(id);});
  $('#del').addEventListener('click',async()=>{if(!confirm('削除しますか？'))return;await dbDel(id);toast('削除しました');renderList();});
}

/* ---------- 設定 ---------- */
async function renderSettings(){
  const s=await stats();
  view.innerHTML=`<div class="card">
    <h2>データ</h2>
    <div class="stats" style="margin-bottom:10px">
      <div><span class="n">${s.total}</span><span class="l">問題</span></div>
      <div><span class="n" style="color:var(--bad)">${s.wrong}</span><span class="l">不正解</span></div>
      <div><span class="n" style="color:var(--review)">${s.review}</span><span class="l">要復習</span></div>
      <div><span class="n" style="color:var(--good)">${s.correct}</span><span class="l">正解</span></div></div>
    <p class="small muted">問題はこの端末のブラウザ内に保存され、取り込むほど蓄積されます。同じURLを再取り込みしても重複しません。</p>
    <div class="row"><button class="btn-primary grow" id="exp">バックアップ書き出し</button>
      <button class="btn-ghost grow" id="imp">読み込み</button></div>
    <input type="file" id="impf" accept="application/json" style="display:none">
    <button class="btn-danger btn-block btn-sm" id="clr" style="margin-top:10px">すべて削除</button>
  </div>
  <div class="card">
    <h2>保存の状態</h2>
    <table class="diag">
      <tr><td>IndexedDB</td><td>${esc(DIAG.idb)}</td></tr>
      <tr><td>localStorage</td><td>${esc(DIAG.ls)}</td></tr>
      <tr><td>永続ストレージ</td><td>${DIAG.persisted===true?'<span style="color:var(--good)">許可済み（消えにくい）</span>':DIAG.persisted===false?'<span style="color:var(--review)">未許可</span>':'不明'}</td></tr>
      <tr><td>使用量</td><td>${DIAG.usage!=null?(DIAG.usage/1048576).toFixed(1)+' MB'+(DIAG.quota?' / '+(DIAG.quota/1048576).toFixed(0)+' MB':''):'不明'}</td></tr>
      <tr><td>最終保存</td><td>${DIAG.lastSaveAt?new Date(DIAG.lastSaveAt).toLocaleString('ja-JP'):'―'}</td></tr>
      ${DIAG.lastError?`<tr><td>エラー</td><td style="color:var(--bad)">${esc(DIAG.lastError)}</td></tr>`:''}
    </table>
    <button class="btn-ghost btn-block btn-sm" id="persist" style="margin-top:10px">永続ストレージを要求する</button>
    <details><summary>データが消えてしまうときは</summary>
      <p class="small muted">・iPhoneのSafariは、7日間そのサイトを開かないと保存データを自動削除することがあります。<b>共有ボタン →「ホーム画面に追加」</b>で追加したアイコンから開くと消えにくくなります。<br>
      ・プライベートブラウズでは保存できません。<br>
      ・履歴/サイトデータの消去でも消えます。<br>
      ・消えても「取り込み」タブの<b>再取り込み</b>で問題は作り直せます。学習状況も残っていれば自動で戻ります。<br>
      ・確実に残したい場合は上の<b>バックアップ書き出し</b>でファイル保存してください。</p>
    </details>
  </div>
  <div class="card">
    <h2>取得プロキシ（上級者向け）</h2>
    <p class="small muted">mjai.ekyu.moe はCORSを許可していないため、公開プロキシ経由で取得します。うまくいかない場合のみ、自前のプロキシURLを指定してください（{url}がURLエンコード済み、{raw}が生URLに置換されます）。</p>
    <input id="proxy" value="${esc(CFG.proxy)}" placeholder="https://example.com/proxy?u={url}">
  </div>
  <div class="card">
    <h2>Claude APIキー（任意）</h2>
    <p class="small muted">スクリーンショット取り込みとAI解説にのみ使用します。URL取り込みだけなら不要です。キーはこの端末にのみ保存されます。</p>
    <input type="password" id="key" value="${esc(CFG.key)}" placeholder="sk-ant-...">
    <label>モデル</label>
    <select id="model">
      <option value="claude-opus-5">claude-opus-5</option>
      <option value="claude-sonnet-5">claude-sonnet-5</option>
      <option value="claude-haiku-4-5">claude-haiku-4-5</option>
    </select>
  </div>
  <button class="btn-primary btn-block" id="save">設定を保存</button>
  <p class="small muted center" style="margin-top:10px">麻雀 何切るクイズ / データは端末内のみ</p>`;
  $('#model').value=CFG.model;
  $('#persist').addEventListener('click',async()=>{ await askPersist();
    toast(DIAG.persisted===true?'永続ストレージが許可されました':'この環境では許可されませんでした（ホーム画面に追加すると通りやすくなります）',4000);
    renderSettings(); });
  $('#save').addEventListener('click',()=>{CFG.key=$('#key').value.trim();CFG.model=$('#model').value;CFG.proxy=$('#proxy').value.trim();toast('保存しました');});
  $('#exp').addEventListener('click',async()=>{
    const all=await dbAll();
    const b=new Blob([JSON.stringify({v:3,exportedAt:Date.now(),items:all,sources:getSources()})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='mahjong-quiz-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);});
  $('#imp').addEventListener('click',()=>$('#impf').click());
  $('#impf').addEventListener('change',async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{const j=JSON.parse(await f.text());const ex=new Set((await dbAll()).map(r=>r.id));let n=0;
      for(const it of (j.items||[])) if(!ex.has(it.id)){await dbPut(it);n++;}
      (j.sources||[]).forEach(addSource); await flush();
      toast(n+'件読み込みました');renderSettings();}catch(err){toast('失敗：'+err.message);}});
  $('#clr').addEventListener('click',async()=>{if(!confirm('すべての問題を削除します。よろしいですか？'))return;
    await dbClear();QUIZ=null;toast('削除しました');renderSettings();});
}
async function boot(){
  await loadAll();
  render();
  askPersist();
  if(DIAG.restored>0) toast(DIAG.restored+'件のデータを復元しました');
  else if(String(DIAG.idb).indexOf('使用不可')===0 && String(DIAG.ls).indexOf('OK')!==0)
    toast('この環境ではデータを保存できません。プライベートブラウズを解除するか、ホーム画面に追加してください',7000);
}
boot();
</script>
</body>
</html>
